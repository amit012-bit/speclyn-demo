# Speclyn — local development stack.
# Runs all three layers: engine (FastAPI) -> backend (Express) -> frontend (Next.js).
#
#   docker compose up --build
#
# Each service also runs fine standalone outside Docker — see README.md.

services:
  engine:
    build:
      context: ./engine
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 8000
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - ANALYSIS_INTERVAL_SECONDS=${ANALYSIS_INTERVAL_SECONDS:-15}
      - MAX_GAPS_PER_CYCLE=${MAX_GAPS_PER_CYCLE:-2}
      - CORS_ORIGIN=http://localhost:3000,http://backend:4000

  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM node:20-slim
        WORKDIR /app
        COPY package*.json ./
        RUN npm install --omit=dev
        COPY . .
        EXPOSE 4000
        CMD ["node", "src/index.js"]
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-dev_only_change_me}
      - PASSWORD=${PASSWORD:-speclyn2026}
      - ENGINE_URL=http://engine:8000
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - engine

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:20-slim
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        RUN npm run build
        EXPOSE 3000
        CMD ["npm", "start"]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
    depends_on:
      - backend
